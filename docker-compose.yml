services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: babel
      POSTGRES_PASSWORD: babel
      POSTGRES_DB: babel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babel -d babel"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-store:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: babel-local
      MINIO_ROOT_PASSWORD: babel-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-data:/data

  node:
    build:
      context: .
      dockerfile: crates/protocol-node/Dockerfile
    environment:
      BABEL_NODE_BIND: 0.0.0.0:8080
      BABEL_PUBLIC_WEB_ORIGIN: http://localhost:5173
      BABEL_DATABASE_URL: postgres://babel:babel@postgres:5432/babel
      BABEL_TRANSLATION_PROVIDER: mock
      BABEL_FACILITATION_PROVIDER: mock
      BABEL_ENABLE_DEMO_ROOM: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --dir apps/web dev --host 0.0.0.0"
    environment:
      VITE_BABEL_API_BASE: http://localhost:8080
      VITE_BABEL_WS_BASE: ws://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      - node

volumes:
  postgres-data:
  object-data:
  pnpm-store:
